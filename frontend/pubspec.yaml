name: smart_meal_planner
description: "A smart meal planner mobile application integrated with Polish grocery stores."
publish_to: 'none'
version: 1.0.0+7

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.1

  # Networking & HTTP
  http: ^1.2.1

  # Logowanie przez Google (natywny SDK — bez przeglądarki/redirect_uri)
  google_sign_in: ^7.2.0

  # Local Storage
  shared_preferences: ^2.2.3
  # Zaszyfrowany magazyn (Android Keystore / iOS Keychain) — token JWT
  # wcześniej był trzymany w SharedPreferences, czyli zwykłym,
  # niezaszyfrowanym plikiem na dysku urządzenia.
  flutter_secure_storage: ^9.2.2

  # Utilities
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # Odbieranie udostępnień z innych aplikacji (np. link do filmiku
  # udostępniony wprost z TikToka przez systemowe menu "Udostępnij").
  receive_sharing_intent: ^1.8.1

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipe_categories/
    - assets/branding/
    - assets/recipe_photos/
