name: smart_meal_planner
description: "A smart meal planner mobile application integrated with Polish grocery stores."
publish_to: 'none'
version: 1.0.0+41

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.1

  # Networking & HTTP
  http: ^1.2.1

  # Logowanie przez Google (natywny SDK — bez przeglądarki/redirect_uri)
  google_sign_in: ^7.2.0

  # Płatności w aplikacji (subskrypcja Premium) — oficjalny pakiet
  # zespołu Fluttera, wspiera Google Play Billing Library 8+ (wymóg
  # Google od 31 sierpnia 2026).
  in_app_purchase: ^3.2.3

  # Reklamy nagradzane (Śledzenie dla kont bez Premium) — oficjalny
  # pakiet Google dla AdMob.
  # UWAGA (NAPRAWA AWARYJNA — TYMCZASOWO WYLACZONE, sierpien 2026):
  # aplikacja zaczela crashowac NATYCHMIAST po otwarciu po skoku wersji
  # 5->9. Zaleznosc CALKOWICIE usunieta z buildu (nie tylko przestano jej
  # uzywac w kodzie Dart), zeby wykluczyc mozliwosc, ze natywny kod SDK
  # ma wlasna, automatyczna inicjalizacje uruchamiana przed main() we
  # Flutterze. Patrz tez lib/services/ad_gate_service.dart i main.dart.
  # google_mobile_ads: ^9.1.0

  # Local Storage
  shared_preferences: ^2.2.3
  # Zaszyfrowany magazyn (Android Keystore / iOS Keychain) — token JWT
  # wcześniej był trzymany w SharedPreferences, czyli zwykłym,
  # niezaszyfrowanym plikiem na dysku urządzenia.
  flutter_secure_storage: ^9.2.2

  # Utilities
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # UWAGA: obsługa udostępnień z TikToka (link -> rozpoznanie przepisu
  # przez AI) NIE korzysta z żadnego pakietu z pub.dev. Dwie kolejne
  # biblioteki do tego celu (receive_sharing_intent,
  # listen_receive_sharing_intent) miały problemy z budowaniem —
  # nieaktualne/niespójnie opublikowane paczki. Zamiast tego używamy
  # własnej, kilkudziesięciolinijkowej implementacji przez MethodChannel
  # (patrz android/.../MainActivity.kt i lib/services/share_intent_handler.dart)
  # — stabilne, wieloletnie API Androida i Fluttera, bez zależności od
  # jakości/aktualności jakiegokolwiek pakietu trzeciej strony.

  # UI & Styling
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/recipe_categories/
    - assets/branding/
    - assets/recipe_photos/
