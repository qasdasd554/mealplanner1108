org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# NAPRAWA: -Xmx8G (poprzednia wartość) powodował, że demon Gradle padał
# w trakcie budowania w Codespace z komunikatem "Gradle build daemon
# disappeared unexpectedly" — to żądanie 8 GB TYLKO dla samego Gradle,
# nie licząc równoległego procesu kompilatora Dart ani reszty systemu,
# przekraczało realnie dostępną pamięć kontenera, więc system operacyjny
# ubijał proces w trakcie pracy. Ujawniło się to dopiero po dodaniu
# mobile_scanner (CameraX + ML Kit), bo dopiero wtedy budowanie
# potrzebowało tyle pamięci naraz, żeby przekroczyć limit.
# 4 GB to wartość bezpieczniejsza dla środowisk z ograniczoną pamięcią,
# wciąż wystarczająca do budowania projektu tej wielkości.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
